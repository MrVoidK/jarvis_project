# Jarvis guvenlik yapilandirmasi - SABLON.
#
# Bu dosyayi kopyalayip ayni dizinde `security.yaml` olarak kaydedin ve
# kendi makinenize ozel gercek yollari girin. `security.yaml` .gitignore'da -
# kisisel/makineye ozel yollar (orn. Obsidian vault'unuz) icerdigi icin
# commit'lenmez (bkz. src/jarvis/core/security_config.py).

# notes_tool.py'nin notlari kaydettigi/okudugu Obsidian vault'unuzun tam yolu.
# Otomatik olarak allowed_directories'e de eklenir (is_path_safe() icin).
obsidian_vault: "C:\\Path\\To\\Your\\Obsidian\\Vault" # KENDI vault yolunuzla degistirin

# Diger arac islemlerinin sinirlandigi ek dizinler. Goreli yollar
# PROJECT_ROOT'a gore cozulur, mutlak yollar oldugu gibi kullanilir.
allowed_directories:
  - "jarvis_workspace" # ListFilesTool'un calisma dizini
  - "notes" # eski notes.txt konumu, geriye donuk uyumluluk

# LaunchAppTool SADECE burada listelenen isimleri calistirabilir - LLM'in
# keyfi bir binary/path uretip calistirmasi mumkun degildir (bkz.
# tools/terminal_tool.py:LaunchAppTool).
known_applications:
  "vs code": "code"
  "chrome": "chrome"
  "steam": "C:\\Program Files (x86)\\Steam\\steam.exe"

# Dinamik arac/ajan manifestleri (agents/registry/*.yaml) icin allowlist (Faz 6.4).
# Bir manifest dosyasi koymak TEK BASINA onu aktive ETMEZ - dosya adinin
# (uzantisiz kok) burada da listelenmesi gerekir (iki elle adim, hicbiri
# otomatik degil). Bos = hicbir dinamik arac yuklenmez (varsayilan).
# Bkz. src/jarvis/core/registry_loader.py, docs/ROADMAP.md Faz 6.4.
enabled_dynamic_agents: []
  # - home_assistant_lights   # -> agents/registry/home_assistant_lights.yaml
